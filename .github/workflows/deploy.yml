name: Deploy to GitHub Pages

# Builds the static (prerendered) site and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".
# Custom domain (one-page.expedientecheck.com) comes from public/CNAME.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static prerender)
        run: bun run build

      - name: Add SPA fallback + disable Jekyll
        # 404.html = index.html so client-side routes resolve on GitHub Pages.
        # .nojekyll stops Jekyll from stripping files/dirs (safety for asset dirs).
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
